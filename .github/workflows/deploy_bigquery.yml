name: Deploy BigQuery Analytics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bigquery/**'
  push:
    branches:
      - main
      - 2026108_criacao_tabela_vendas_marcas_gb
    paths:
      - 'bigquery/**'

jobs:
  deploy:
    name: Executar Deploy no BigQuery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Definir Ambiente e Executar DDL da Tabela
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_PROJECT="sandbox-jessica"
            echo "--- Executando deploy em AMBIENTE DE SANDBOX ($TARGET_PROJECT) ---"
          else
            # Durante testes na branch de feature, roda em Sandbox também
            if [ "${{ github.ref_name }}" == "main" ]; then
              TARGET_PROJECT="trusted-zone"
              echo "--- Executando deploy em AMBIENTE DE PRODUÇÃO ($TARGET_PROJECT) ---"
            else
              TARGET_PROJECT="sandbox-jessica"
              echo "--- Executando deploy em AMBIENTE DE SANDBOX ($TARGET_PROJECT) ---"
            fi
          fi

          # Executa DDL da Tabela
          bq query --use_legacy_sql=false --project_id=$TARGET_PROJECT < "bigquery/table/trusted-zone/case-boticario-analytics/tb_vendas_marcas_gb.sql"