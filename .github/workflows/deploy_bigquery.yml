name: Deploy BigQuery Analytics (Metadata Driven)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bigquery/**'
  push:
    branches:
      - main
    paths:
      - 'bigquery/**'

jobs:
  deploy:
    name: Executar Deploy baseado em Configuração JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar Arquivos JSON Alterados ou Criados
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: 'bigquery/**/*.json'

      - name: Autenticar no GCP
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Executar Deploy com Base nos Arquivos de Configuração
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for json_file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            sql_file="${json_file%.json}.sql"

            if [ ! -f "$sql_file" ]; then
              echo "Aviso: Arquivo SQL $sql_file não encontrado para a config $json_file."
              continue
            fi

            # Extrai dataset e projetos destino usando jq
            DATASET=$(jq -r '.dataset' "$json_file")
            
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              TARGET_PROJECT=$(jq -r '.environments.sandbox' "$json_file")
              echo "--- MODO SANDBOX: Projeto $TARGET_PROJECT ---"
            else
              TARGET_PROJECT=$(jq -r '.environments.production' "$json_file")
              echo "--- MODO PRODUÇÃO: Projeto $TARGET_PROJECT ---"
            fi

            echo "Garantindo dataset $DATASET no projeto $TARGET_PROJECT..."
            bq mk --dataset --if_exists $TARGET_PROJECT:$DATASET

            echo "Executando DDL $sql_file no projeto $TARGET_PROJECT..."
            bq query --use_legacy_sql=false --project_id=$TARGET_PROJECT < "$sql_file"
          done