name: Ingestao RAW - Vendas Marcas GB

on:
  push:
    branches: [ "main", "20261009_ajuste_orquestrador*" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  executar-ingestao-raw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl google-cloud-bigquery

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Executar Ingestão RAW
        env:
          GOOGLE_CLOUD_PROJECT: 'raw-zone-510905'
        run: |
          python orquestrador/trusted-zone/case_boticario_analytics/ingestao_raw.py